AWSTemplateFormatVersion: "2010-09-09"
Description: "Seedha Properties - Enterprise 10M+ Scalable Architecture (ECS Fargate Autoscaling + RDS PostGIS + ElastiCache Redis + SQS Async Queue + S3 + WAF + ALB)"

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
  DbUsername:
    Type: String
    Default: seedha_admin
    NoEcho: true
  DbPassword:
    Type: String
    Default: SeedhaStagingPass2026!
    NoEcho: true

Resources:
  # 1. VPC & Networking
  StagingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: seedha-staging-vpc
        - Key: Project
          Value: SeedhaProperties

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Project
          Value: SeedhaProperties

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref StagingVPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (for ALB)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: ap-south-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: seedha-staging-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: ap-south-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: seedha-staging-public-b

  # Private Subnets (for RDS, Redis & ECS Tasks)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: ap-south-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: seedha-staging-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: ap-south-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: seedha-staging-private-b

  # 2. Least-Privilege Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB Security Group - Public Ingress 80/443"
      VpcId: !Ref StagingVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ECS Fargate Security Group - Ingress strictly from ALB"
      VpcId: !Ref StagingVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "RDS PostgreSQL Security Group - Ingress strictly from ECS"
      VpcId: !Ref StagingVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ElastiCache Redis Security Group - Ingress strictly from ECS"
      VpcId: !Ref StagingVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16

  # 3. Amazon SQS Queues (Async Processing & Dead-Letter Queue)
  AsyncJobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: seedha-staging-async-jobs-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  AsyncJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: seedha-staging-async-jobs
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AsyncJobDeadLetterQueue.Arn
        maxReceiveCount: 3

  # 4. S3 Media & Private Docs Buckets
  PublicMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: seedha-properties-public-media-staging
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  PrivateDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: seedha-properties-private-docs-staging
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # 5. RDS PostgreSQL 16 + PostGIS Instance (Private Subnets)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Private Subnets for Seedha Staging RDS"
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  StagingRDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: seedha-staging-rds
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: "16.3"
      AllocatedStorage: "20"
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      MultiAZ: false

  # 6. ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: seedha-staging-cluster

Outputs:
  PublicMediaBucketName:
    Value: !Ref PublicMediaBucket
  PrivateDocsBucketName:
    Value: !Ref PrivateDocsBucket
  RDSEndpoint:
    Value: !GetAtt StagingRDSInstance.Endpoint.Address
  AsyncJobQueueUrl:
    Value: !Ref AsyncJobQueue
