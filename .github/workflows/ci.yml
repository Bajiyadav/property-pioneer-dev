name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  security:
    name: 1. Security & Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Secret hygiene check
        run: |
          if grep -rnE 'VITE_[A-Z_]*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD)' src .env.example 2>/dev/null; then
            echo "::error::Secret key exposed behind public VITE_ prefix"; exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env file is tracked in git"; exit 1
          fi
          echo "✓ Secret hygiene verified"

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=critical

      - name: License compliance check
        run: |
          npx --yes license-checker-rspack --production --summary > licenses.txt 2>/dev/null || true
          cat licenses.txt >> "$GITHUB_STEP_SUMMARY" || true
          if grep -Eiq '(^|[^A-Za-z])(GPL-2|GPL-3|AGPL)' licenses.txt 2>/dev/null; then
            echo "::error::Copyleft licence detected in production dependencies"; exit 1
          fi
          echo "✓ License compliance verified"

  quality:
    name: 2. Code Quality (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint

  typecheck:
    name: 3. TypeScript Strict Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck

  unit-tests:
    name: 4. Unit & Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  migration-safety:
    name: 5. Migration & Schema Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Destructive SQL Check
        run: |
          if grep -rniE '\b(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE|DELETE\s+FROM|UPDATE\s+public\.)\b' supabase/migrations/; then
            echo "::error::Destructive migration detected — requires explicit review"; exit 1
          fi
          echo "✓ No destructive statements in migrations"

  build:
    name: 6. Production SSR Build
    runs-on: ubuntu-latest
    needs: [quality, typecheck, unit-tests]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'placeholder' }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://property-pioneer-dev.vercel.app' }}
      - name: Bundle Budget Check
        run: |
          TOTAL=$(du -sk .output/public 2>/dev/null | cut -f1)
          echo "Total client payload: ${TOTAL} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "${TOTAL:-0}" -gt 15000 ]; then
            echo "::error::Client bundle ${TOTAL}KB exceeds 15MB budget"; exit 1
          fi

  e2e:
    name: 7. E2E & Business QA
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://property-pioneer-dev.vercel.app' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release-gate:
    name: 8. Seedha Properties Release Gate Summary
    runs-on: ubuntu-latest
    needs: [security, quality, typecheck, unit-tests, migration-safety, build, e2e]
    steps:
      - name: Generate Release Gate Summary Report
        run: |
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"
          echo " SEEDHA PROPERTIES RELEASE GATE     " >> "$GITHUB_STEP_SUMMARY"
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Security Scan:          PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Secret Scan:            PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Dependency Scan:        PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "License Scan:           PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "ESLint Code Quality:    PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript Strict:      PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit & Coverage Tests:  PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Database Safety:        PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Build:       PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "E2E & Responsive QA:    PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE DECISION: GO" >> "$GITHUB_STEP_SUMMARY"
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"
