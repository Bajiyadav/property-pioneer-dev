name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying manually?
        required: false

concurrency:
  group: production
  cancel-in-progress: false # never cancel a half-finished production deploy

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: Pre-deploy quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=critical

  migrations:
    name: Verify database migrations
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Lint migration SQL
        run: |
          # Destructive statements must never reach production unreviewed.
          if grep -rniE '\b(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE)\b' supabase/migrations/; then
            echo "::error::Destructive migration detected — needs an explicit reviewed override"; exit 1
          fi
          echo "✓ no destructive statements"

      - name: Backup before applying
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set — skipping backup and migration apply"; exit 0
          fi
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "backup-$(date +%Y%m%d-%H%M%S).sql"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-backup
          path: backup-*.sql
          retention-days: 30

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -z "$SUPABASE_DB_URL" ] && exit 0
          supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [gate, migrations]
    environment: production
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous: ${{ steps.previous.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Record the currently-live deployment (rollback target)
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREV=$(npx vercel ls --token="$VERCEL_TOKEN" --prod 2>/dev/null | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | head -1)
          echo "url=$PREV" >> "$GITHUB_OUTPUT"
          echo "Rollback target: $PREV"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  verify:
    name: Post-deploy health checks
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Health check
        run: |
          URL="${{ secrets.PRODUCTION_URL || 'https://property-pioneer-dev.vercel.app' }}"
          PATHS=("/" "/properties?q=&city=&listing=&minPrice=0&maxPrice=0&beds=0" "/buy" "/commercial" "/villas" "/plots" "/farm-lands" "/auth?redirect=" "/help" "/blog" "/sitemap.xml")
          for path in "${PATHS[@]}"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}${path}")
            echo "$path -> $CODE"
            if [ "$CODE" -ge 400 ]; then
              echo "::error::$path returned $CODE"
              exit 1
            fi
          done

      - name: Production smoke tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://property-pioneer-dev.vercel.app' }}

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    steps:
      - name: Promote the previous deployment back to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREV: ${{ needs.deploy.outputs.previous }}
        run: |
          if [ -z "$PREV" ]; then echo "::error::No rollback target recorded"; exit 1; fi
          npx vercel promote "$PREV" --token="$VERCEL_TOKEN" --yes
          echo "Rolled back to $PREV"

      - name: Open an incident report
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Incident: production deploy failed on ${context.sha.slice(0,7)}`,
              labels: ['incident', 'production'],
              body: [
                '## Incident',
                `Commit: ${context.sha}`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Rolled back to: ${{ needs.deploy.outputs.previous }}`,
                '',
                '### Next steps',
                '- [ ] Confirm production is healthy on the previous build',
                '- [ ] Identify the failing check in the run log',
                '- [ ] Fix forward on a `hotfix/*` branch',
                '- [ ] Post-mortem',
              ].join('\n'),
            });
