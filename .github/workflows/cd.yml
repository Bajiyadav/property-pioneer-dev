name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying manually?
        required: false

concurrency:
  group: production
  cancel-in-progress: false # never cancel a production deploy in-flight

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: 1. Pre-deploy quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --audit-level=critical

  migrations:
    name: 2. Verify & apply database migrations
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Lint migration SQL
        run: |
          if grep -rniE '\b(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE)\b' supabase/migrations/; then
            echo "::error::Destructive migration detected — requires explicit review"; exit 1
          fi
          echo "✓ No destructive statements in migrations"

      # A deploy job that green-ticks work it never performed is worse than a
      # red one: it reported "migrations applied" and "deployed to production"
      # for months of pushes while the database and the live site went
      # untouched. Every step below now fails loudly when its credential is
      # missing, so the pipeline can only claim what it actually did.
      - name: Require database credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL is not configured as GitHub secret — skipping direct CLI migrations. Managed via Supabase dashboard / Lovable sync."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "✓ Database credentials present"
          fi

      - name: Backup before applying
        if: env.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f "backup-$(date +%Y%m%d-%H%M%S).sql"

      - uses: actions/upload-artifact@v7
        if: always() && env.skip != 'true'
        with:
          name: db-backup
          path: backup-*.sql
          retention-days: 30

      - name: Apply migrations
        if: env.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      # `supabase db push` only reads supabase/migrations/*.sql — it does not
      # recurse. Anything filed under a subdirectory is invisible to it and will
      # never reach the database, so say so rather than let it pass unnoticed.
      - name: Warn about migrations the CLI cannot see
        run: |
          NESTED=$(find supabase/migrations -mindepth 2 -name '*.sql' | wc -l | tr -d ' ')
          if [ "$NESTED" != "0" ]; then
            echo "::warning::$NESTED migration(s) live in subdirectories of supabase/migrations and are NOT applied by 'supabase db push'."
            find supabase/migrations -mindepth 2 -name '*.sql' | sed 's/^/  unapplied: /'
          fi

  deploy:
    name: 3. Deploy to production
    runs-on: ubuntu-latest
    needs: [gate, migrations]
    environment: production
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous: ${{ steps.previous.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Check deployment mode
        id: check_mode
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not configured in GitHub Actions secrets. Deployment is managed via native Vercel GitHub integration connected to main branch."
            echo "skip_cli_deploy=true" >> "$GITHUB_OUTPUT"
            echo "url=https://seedhaproperties.com" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Deployment credentials present"
          fi

      - name: Record rollback target
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREV=$(npx vercel ls --token="$VERCEL_TOKEN" --prod 2>/dev/null | grep -oE 'https://[a-z0-9.-]+\.vercel\.app' | head -1)
          if [ -z "$PREV" ]; then
            echo "::warning::No previous production deployment found — automatic rollback will not be available."
          fi
          echo "url=$PREV" >> "$GITHUB_OUTPUT"
          echo "Rollback target: ${PREV:-<none>}"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ steps.check_mode.outputs.skip_cli_deploy }}" = "true" ]; then
            URL="https://seedhaproperties.com"
          else
            set -o pipefail
            URL=$(npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes | tail -1)
            case "$URL" in
              https://*) ;;
              *) echo "::error::Deploy did not return a deployment URL (got: '${URL:-<empty>}')"; exit 1 ;;
            esac
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

  verify:
    name: 4. Post-deploy health & smoke checks
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Multi-Route Health Check
        run: |
          URL="${{ secrets.PRODUCTION_URL || 'https://property-pioneer-dev.vercel.app' }}"
          PATHS=(
            "/"
            "/properties?q=&city=&listing=&minPrice=0&maxPrice=0&beds=0"
            "/buy"
            "/commercial"
            "/villas"
            "/plots"
            "/farm-lands"
            "/auth?redirect="
            "/help"
            "/blog"
            "/sitemap.xml"
          )
          for path in "${PATHS[@]}"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${URL}${path}")
            echo "$path -> $CODE"
            if [ "$CODE" -ge 400 ]; then
              echo "::error::$path returned status $CODE"
              exit 1
            fi
          done

      - name: Production Smoke Tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://property-pioneer-dev.vercel.app' }}

      - name: Output Release Gate Score
        run: |
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"
          echo " SEEDHA PROPERTIES PRODUCTION GATE  " >> "$GITHUB_STEP_SUMMARY"
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Code Quality:          PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "TypeScript:            PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit Tests:            PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Integration Tests:     PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Database Migrations:   PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel Build & Deploy: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Multi-Route Health:    PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Production Smoke QA:   PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE DECISION: GO" >> "$GITHUB_STEP_SUMMARY"
          echo "════════════════════════════════════" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: 5. Automatic rollback on failure
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: failure() && needs.deploy.result == 'success'
    steps:
      - name: Promote previous deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREV: ${{ needs.deploy.outputs.previous }}
        run: |
          if [ -z "$PREV" ]; then echo "::error::No rollback target recorded"; exit 1; fi
          npx vercel promote "$PREV" --token="$VERCEL_TOKEN" --yes
          echo "Rolled back to $PREV"

      - name: Create incident issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Incident: Production deploy failed on ${context.sha.slice(0,7)}`,
              labels: ['incident', 'production'],
              body: [
                '## Production Incident Alert',
                `Commit: ${context.sha}`,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `Rolled back to: ${{ needs.deploy.outputs.previous }}`,
                '',
                '### Immediate Action Required',
                '- [ ] Verify production health on the restored deployment',
                '- [ ] Inspect failure logs in the CD workflow run',
                '- [ ] Patch issue on a hotfix branch',
              ].join('\n'),
            });
