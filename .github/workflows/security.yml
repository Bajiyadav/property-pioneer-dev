name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # full history so rotated-but-committed keys are caught
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Code scanning upload requires GitHub Advanced Security, which is not
    # available on a free private repo. Kept wired and non-blocking so it starts
    # reporting the moment the plan allows it, instead of sitting permanently red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependencies:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=critical
      - name: OWASP dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

  hygiene:
    name: Secret-handling hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets behind a VITE_ prefix
        run: |
          # VITE_* is inlined into the client bundle. Anything secret behind that
          # prefix is public by construction.
          # Only a VITE_-prefixed secret is a leak. .env.example documents the
          # server-side SUPABASE_SERVICE_ROLE_KEY by name, which is fine.
          if grep -rnE 'VITE_[A-Z_]*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD)' src .env.example 2>/dev/null; then
            echo "::error::A secret-looking value is exposed behind a VITE_ prefix"; exit 1
          fi
          echo "✓ no secrets behind VITE_"

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked in git"; exit 1
          fi
          echo "✓ .env untracked"

      - name: No committed signing-secret or DB-password defaults in backend config
        run: |
          # The connected Lovable/IDE sync has repeatedly re-injected a committed
          # ${JWT_SECRET:<literal>} / ${DB_PASSWORD:<literal>} default into the
          # Spring config after it was removed. A value behind the ":" is a
          # fallback baked into the image — a signing key in the repo. This fails
          # the build if any Spring property provides such a default for a
          # secret-bearing key, so the regression cannot merge unnoticed.
          if grep -rnE '\$\{(JWT_SECRET|DB_PASSWORD|DATABASE_URL|SUPABASE_SERVICE_ROLE_KEY):[^}]+\}' \
               backend-java/src/main/resources 2>/dev/null; then
            echo "::error::A secret-bearing Spring property has a committed default value"; exit 1
          fi
          echo "✓ no committed secret defaults in backend config"

      - name: Server-only modules never imported from client code
        run: |
          # A *.server.ts import from a component would ship service-role code
          # to the browser. Server functions must be the only bridge.
          BAD=$(grep -rln 'from "@/lib/.*\.server"' src/modules src/shared src/app 2>/dev/null \
                | grep -v '\.server\.' || true)
          if [ -n "$BAD" ]; then
            echo "::error::client-side import of a server-only module:"; echo "$BAD"; exit 1
          fi
          echo "✓ server/client boundary intact"
