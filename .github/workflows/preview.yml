name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Vercel preview + smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(npx vercel deploy --token="$VERCEL_TOKEN" --yes | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the preview
        run: npx playwright install --with-deps chromium && npm run test:e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}

      - name: Comment the preview URL on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `### Preview deployed\n\n${url}\n\nSmoke tests passed against this URL.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith('### Preview deployed'));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
