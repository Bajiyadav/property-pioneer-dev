name: Mobile APK Cloud Build

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Prepare Native Android Structure
        working-directory: apps/mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Generating native Android wrapper..."
            flutter create . --org com.seedhaproperties --project-name seedha_properties_mobile --platforms=android
          fi

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Official App Launcher Icons
        working-directory: apps/mobile
        run: dart run flutter_launcher_icons

      - name: Run Flutter Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Mobile Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Setup Keystore (if secret provided)
        working-directory: apps/mobile
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release upload keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'seedha-upload' }}
          storeFile=upload-keystore.jks
          EOF
            echo "Keystore configured successfully."
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret not found. Building with debug signing fallback."
          fi

      - name: Build Android App Bundle (.aab) for Google Play
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=https://iyttetfaavokzyexvqam.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_gcIp8Q5STuoIZf-d7pJnGA_CuqPEo2x \
            --dart-define=API_BASE_URL=https://seedhaproperties.com/api \
            --dart-define=GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}

      - name: Build Android APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=https://iyttetfaavokzyexvqam.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_gcIp8Q5STuoIZf-d7pJnGA_CuqPEo2x \
            --dart-define=API_BASE_URL=https://seedhaproperties.com/api \
            --dart-define=GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}

      - name: Verify Generated Artifacts
        working-directory: apps/mobile
        run: |
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB file not found at $AAB_PATH"
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi
          echo "SUCCESS: Found $AAB_PATH (Size: $(ls -lh "$AAB_PATH" | awk '{print $5}'))"
          echo "SUCCESS: Found $APK_PATH (Size: $(ls -lh "$APK_PATH" | awk '{print $5}'))"

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v7
        with:
          name: seedha-properties-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: seedha-properties-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pipeline Completed Successfully
        run: echo "🎉 Seedha Properties Mobile AAB & APK Build Pipeline completed successfully!"
