name: Mobile APK Cloud Build

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install Web Dependencies
        run: npm ci

      - name: Run Web Regression Tests (Vitest)
        run: npm test

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Prepare Native Android Structure
        working-directory: apps/mobile
        run: |
          if [ ! -d "android" ]; then
            echo "Generating native Android wrapper..."
            flutter create . --org com.seedhaproperties --project-name seedha_properties_mobile --platforms=android
          fi

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Generate Official App Launcher Icons
        working-directory: apps/mobile
        run: dart run flutter_launcher_icons

      - name: Run Flutter Static Analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Mobile Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=https://iyttetfaavokzyexvqam.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_gcIp8Q5STuoIZf-d7pJnGA_CuqPEo2x \
            --dart-define=API_BASE_URL=https://seedhaproperties.com/api

      - name: Verify Generated APK File
        working-directory: apps/mobile
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found at $APK_PATH"
            exit 1
          fi
          FILE_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "SUCCESS: Found $APK_PATH (Size: $FILE_SIZE)"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seedha-properties-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Pipeline Completed Successfully
        run: echo "🎉 Seedha Properties Mobile APK Build & Test Pipeline completed successfully!"
