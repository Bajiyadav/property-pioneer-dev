server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: seedha-properties-backend-staging
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-damp-tree-a1310t1a-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gK7Ld8PefVha}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
  data:
    redis:
      repositories:
        enabled: false

seedha:
  jwt:
    secret: ${JWT_SECRET:v2-staging-seedha-properties-enterprise-hmac-sha512-secure-staging-key-do-not-use-in-production-min-64-bytes}
    access-token-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins:
      - https://staging.seedhaproperties.com
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:8085
