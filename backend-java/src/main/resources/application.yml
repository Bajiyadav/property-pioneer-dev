server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: seedha-properties-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seedha_db}
    username: ${DB_USERNAME:seedha_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: false
        show_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Seedha Platform Custom Config
seedha:
  jwt:
    # Supplied by the environment only. A committed default would be a signing key
    # in the repository, and the application fails to start without it by design.
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:30}
  aws:
    region: ${AWS_REGION:ap-south-1}
    public-bucket: ${S3_PUBLIC_MEDIA_BUCKET:seedha-properties-public-media-staging}
    private-bucket: ${S3_PRIVATE_DOCS_BUCKET:seedha-properties-private-docs-staging}
    sqs-queue-url: ${SQS_QUEUE_URL:}
  cors:
    allowed-origins:
      - https://seedhaproperties.com
      - https://www.seedhaproperties.com
      - https://staging.seedhaproperties.com
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:8085

logging:
  pattern:
    console: '{"service":"seedha-java-backend","timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","thread":"%t","logger":"%c","message":"%m"}%n'
  level:
    root: INFO
    com.seedha.properties: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
