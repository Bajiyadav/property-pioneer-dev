name: seedha_properties_mobile
description: "SEEDHA Properties - India's Direct-Owner PropTech Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  intl: ^0.19.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  http: ^1.2.1
  image_picker: ^1.2.3
  uuid: ^4.6.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
